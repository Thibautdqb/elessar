name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install "ruff==0.6.9"
          ruff check src tests docs examples

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Record environment
        run: python -m pip freeze > environment.txt
      - name: Test
        run: python -m pytest -q --junitxml=unit-first.xml
      - name: Repeat complete ordinary suite
        run: python -m pytest -q --junitxml=unit-repeat.xml
      - name: Demo
        shell: bash
        run: python examples/demo.py > /dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ordinary-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            unit-*.xml
            environment.txt

  minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
      - run: python -m pip install -c ci/constraints-min.txt -e ".[dev]"
      - run: python -m pip freeze > minimum-environment.txt
      - run: python -m pytest -q --junitxml=minimum.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: declared-minimum-dependencies
          path: |
            minimum.xml
            minimum-environment.txt

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Clean wheel and sdist smoke tests
        shell: bash
        run: |
          for archive in dist/*.whl dist/*.tar.gz; do
            clean_env="$RUNNER_TEMP/elessar-clean-$(basename "$archive")"
            python -m venv "$clean_env"
            "$clean_env/bin/python" -m pip install "$archive"
            "$clean_env/bin/python" -I ci/smoke.py
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-candidate-distributions
          path: dist/
