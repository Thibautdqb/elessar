name: Statistical validation

# Each seed stream replays the full fixed benchmark suite and independently seeds the new release designs.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed-stream: [0, 1]
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate
        env:
          ELESSAR_VALIDATION_OUT: validation-results.json
          ELESSAR_VALIDATION_SEED_OFFSET: ${{ matrix.seed-stream }}
          ELESSAR_VALIDATION_DATA: .validation-cache
        run: python -m pytest -q -m validation tests/validation --junitxml=statistical.xml
      - run: python -m pip freeze > validation-environment.txt
        if: always()
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: validation-seed-${{ matrix.seed-stream }}
          path: |
            validation-results.json
            statistical.xml
            validation-environment.txt
