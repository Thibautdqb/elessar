[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elessar"
version = "0.3.0"
description = "Automated exploratory data analysis and data-quality profiling for pandas DataFrames"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thibautdqb" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "dask[dataframe]>=2024.1",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
]
keywords = ["pandas", "eda", "data-profiling", "statistics", "data-quality", "dask", "parquet", "feature-selection", "pca", "time-series", "outliers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
elessar = "elessar.cli:main"

[project.urls]
Homepage = "https://github.com/thibautdqb/elessar"

[tool.hatch.build.targets.wheel]
packages = ["src/elessar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
