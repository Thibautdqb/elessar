[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elessar"
dynamic = ["version"]
description = "Automated exploratory data analysis and data-quality profiling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thibautdqb" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "dask[dataframe]>=2024.1",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
]
keywords = ["pandas", "eda", "data-profiling", "statistics", "data-quality", "dask", "parquet", "feature-selection", "pca", "time-series", "outliers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "statsmodels>=0.14"]

[project.scripts]
elessar = "elessar.cli:main"

[project.urls]
Homepage = "https://github.com/thibautdqb/elessar"
Repository = "https://github.com/thibautdqb/elessar"
Issues = "https://github.com/thibautdqb/elessar/issues"
Changelog = "https://github.com/thibautdqb/elessar/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/elessar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/elessar"]

[tool.hatch.build.targets.sdist]
include = ["src/elessar", "tests", "examples", "README.md", "CHANGELOG.md", "VALIDATION.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 125
src = ["src", "tests"]

[tool.ruff.lint]
# real errors only: undefined names, bugs, syntax and whitespace; formatting is left to the authors
select = ["F", "B", "E7", "E9", "W"]
ignore = ["B905"]  # zip() without strict=: the lengths are equal by construction, and Python 3.10 is supported

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["validation: statistical validation by simulation (slow): python -m pytest -m validation tests/validation"]
addopts = "-m 'not validation'"
