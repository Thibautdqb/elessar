[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elessar"
version = "0.1.0"
description = "The Elfstone for pandas: see everything about a DataFrame, and how to heal it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thibautdqb" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]
keywords = ["pandas", "eda", "data-profiling", "statistics", "data-quality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
elessar = "elessar.cli:main"

[project.urls]
Homepage = "https://github.com/thibautdqb/elessar"

[tool.hatch.build.targets.wheel]
packages = ["src/elessar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
